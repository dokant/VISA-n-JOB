# Visa&Job on one server (A-8, DECISIONS Q-30, Q-31): Caddy (HTTPS) → app; worker; migrations;
# daily backups. Staging: PostgreSQL runs here too, as the `db` container (profile `local-db`).
# Production later: a managed PostgreSQL (DATABASE_URL with sslmode=require, CA in deploy/certs)
# and the profile turned off (DEPLOY.md "운영 전환").
#
# Run from this folder (deploy/). Settings come from deploy/.env (copy of .env.production.example;
# never committed). Compose reads the same file for the ${...} values below and for
# COMPOSE_PROFILES (staging: COMPOSE_PROFILES=local-db, which starts the db service).
#   docker compose build
#   docker compose up -d
# Steps, checks, backups and restore: deploy/DEPLOY.md.

name: visanjob

x-app: &app
  image: visanjob-app:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: Dockerfile
    # Baked into statically rendered pages; a change needs `docker compose build` (DEPLOY.md).
    args:
      SITE_URL: ${SITE_URL:?SITE_URL is required in deploy/.env}
      SITE_BRAND_WORDMARK: ${SITE_BRAND_WORDMARK:-}
      SITE_BRAND_NAME_KO: ${SITE_BRAND_NAME_KO:-}
      SITE_BRAND_TAGLINE: ${SITE_BRAND_TAGLINE:-}
      SITE_ADMIN_SCRIVENER_OFFICE_NAME: ${SITE_ADMIN_SCRIVENER_OFFICE_NAME:-}
      SITE_BUSINESS_REG_NO: ${SITE_BUSINESS_REG_NO:-}
      SITE_ADMIN_SCRIVENER_REG_NO: ${SITE_ADMIN_SCRIVENER_REG_NO:-}
      SITE_JOB_PLACEMENT_NAME: ${SITE_JOB_PLACEMENT_NAME:-}
      SITE_JOB_PLACEMENT_REG_NO: ${SITE_JOB_PLACEMENT_REG_NO:-}
      SITE_REPRESENTATIVE: ${SITE_REPRESENTATIVE:-}
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      SITE_PHONE: ${SITE_PHONE:-}
      SITE_EMAIL: ${SITE_EMAIL:-}
      FEATURE_DEMAND_MAP: ${FEATURE_DEMAND_MAP:-false}
      FEATURE_PUBLIC_JOBS: ${FEATURE_PUBLIC_JOBS:-false}
      FEATURE_REFERRAL_REWARD: ${FEATURE_REFERRAL_REWARD:-false}
      FEATURE_EMPLOYER_CANDIDATES: ${FEATURE_EMPLOYER_CANDIDATES:-false}
  env_file: .env
  environment:
    NODE_ENV: production
    # Root CA of a managed database (production, pg-boss / node-postgres verifies the server
    # certificate). Placed by a person (DEPLOY.md "운영 전환"). Not needed for the local db: the
    # entrypoint drops the variable when the file is missing.
    NODE_EXTRA_CA_CERTS: /certs/db-ca.pem
  volumes:
    - ./certs:/certs:ro
  init: true
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Wait for the local database when it runs (profile local-db). `required: false`: with a managed
# database the db service is not started and the dependency is skipped (Compose 2.20 or newer).
x-wait-db: &wait-db
  db:
    condition: service_healthy
    required: false

services:
  # PostgreSQL inside the server (staging, Q-31). Reached only on the compose network as host
  # `db`: no host port. Data in the named volume db-data. Settings kept small for a 2 GB server.
  db:
    image: postgres:17.9-bookworm
    profiles: ["local-db"]
    restart: unless-stopped
    # Only what the image needs — the app secrets (deploy/.env) are not given to the database.
    environment:
      POSTGRES_USER: visanjob
      POSTGRES_DB: visanjob
      # Generated by scripts/gen-secrets.ts. Used only when the volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      TZ: Asia/Seoul
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visanjob -d visanjob"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s
    logging: *logging

  # Daily backups (Q-31): pg_dump -Fc of DATABASE_URL and a tar of the private-files volume into
  # BACKUP_DIR on the host, one set per day, the newest BACKUP_KEEP kept. Files 0600, folders 0700.
  # Script: deploy/backup.sh. Backup now: `docker compose run --rm backup once` (DEPLOY.md).
  backup:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    depends_on: *wait-db
    entrypoint: ["sh", "/usr/local/bin/visanjob-backup"]
    command: ["loop"]
    # Only the connection string — not the other app secrets.
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: Asia/Seoul
    volumes:
      - ./backup.sh:/usr/local/bin/visanjob-backup:ro
      - private-files:/private:ro
      - ${BACKUP_DIR:-/home/ubuntu/visanjob-backups}:/backups
    logging: *logging

  # Applies prisma/migrations once, then exits. app and worker start only after it succeeded.
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on: *wait-db

  app:
    <<: *app
    command: ["app"]
    depends_on:
      <<: *wait-db
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /certs/db-ca.pem
      PRIVATE_STORAGE_DIR: /data/private
    volumes:
      - ./certs:/certs:ro
      # Private uploads (R-210, 소개 확인서). Only this container mounts it.
      - private-files:/data/private
    # Not published on the host: only Caddy reaches it on the internal network.
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      <<: *wait-db
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  # Manual only: `docker compose run --rm seed` (reference data + SEED_ADMIN_* account).
  seed:
    <<: *app
    command: ["seed"]
    restart: "no"
    profiles: ["tools"]
    depends_on: *wait-db

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Only what the Caddyfile reads — the app secrets are not given to Caddy.
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.visanjob.co.kr}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:?STAGING_BASIC_AUTH_USER is required}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH:?STAGING_BASIC_AUTH_HASH is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  private-files:
  caddy-data:
  caddy-config:

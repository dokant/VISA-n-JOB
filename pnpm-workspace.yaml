# pnpm build-script allow list (pnpm >= 10 blocks dependency install scripts by default).
allowBuilds:
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": false
  esbuild: true
  prisma: true
